<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette preview</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --ui-bg: #17181a;
        --ui-panel: #1e2023;
        --ui-line: #303338;
        --ui-text: #e8e6e3;
        --ui-dim: #8b8f96;
        --ui-hi: #6ea8fe;
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        background: var(--ui-bg);
        color: var(--ui-text);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      }

      /* ---------- sidebar ---------- */
      aside {
        width: 268px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--ui-line);
        background: var(--ui-panel);
      }
      header {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--ui-line);
      }
      header h1 { margin: 0; font-size: 13px; letter-spacing: 0.02em; }
      header p { margin: 4px 0 0; color: var(--ui-dim); font-size: 11.5px; }

      .list { overflow-y: auto; padding: 8px; flex: 1; }

      button.p {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0 0 6px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.p:hover { background: #26292d; }
      button.p[aria-current="true"] {
        background: #24303f;
        border-color: var(--ui-hi);
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .num {
        width: 15px;
        color: var(--ui-dim);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }
      .name { flex: 1; font-weight: 500; }
      .chips { display: flex; gap: 3px; margin: 7px 0 0 23px; }
      .chip {
        width: 26px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .meta {
        margin: 6px 0 0 23px;
        color: var(--ui-dim);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .tag {
        font-size: 9.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 1px 5px;
        border-radius: 3px;
        border: 1px solid currentColor;
      }
      .tag.live { color: #7fd1a0; }
      .tag.cur { color: #e0b568; }
      .warn { color: #e8846b; }
      .good { color: #7fd1a0; }

      /* ---------- detail ---------- */
      .detail {
        border-top: 1px solid var(--ui-line);
        padding: 12px 14px 14px;
      }
      .detail h2 {
        margin: 0 0 8px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ui-dim);
      }
      pre {
        margin: 0;
        padding: 9px 10px;
        border-radius: 6px;
        background: #121315;
        border: 1px solid var(--ui-line);
        color: #cdd3da;
        font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-x: auto;
      }
      .copy {
        margin-top: 8px;
        width: 100%;
        padding: 7px;
        border-radius: 6px;
        border: 1px solid var(--ui-line);
        background: #26292d;
        color: var(--ui-text);
        font: inherit;
        cursor: pointer;
      }
      .copy:hover { border-color: var(--ui-hi); }
      kbd {
        padding: 1px 4px;
        border-radius: 3px;
        border: 1px solid var(--ui-line);
        background: #121315;
        font: 10px ui-monospace, monospace;
      }

      /* ---------- stage ---------- */
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .bar {
        padding: 7px 14px;
        border-bottom: 1px solid var(--ui-line);
        color: var(--ui-dim);
        font-size: 11.5px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      iframe { flex: 1; width: 100%; border: 0; background: #fff; }
      .err {
        margin: 20px;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid #5c2b2b;
        background: #2a1a1a;
        color: #f0b3a8;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <h1>Palette preview</h1>
        <p>Live <code>index.html</code> with the tokens swapped.</p>
      </header>

      <div class="list" id="list"></div>

      <div class="detail">
        <h2>Paste into <code>:root</code></h2>
        <pre id="css">—</pre>
        <button class="copy" id="copy">Copy three lines</button>
        <p style="margin: 9px 0 0; color: var(--ui-dim); font-size: 11px">
          <kbd>1</kbd>–<kbd>8</kbd> jump · <kbd>↑</kbd><kbd>↓</kbd> step
        </p>
      </div>
    </aside>

    <main>
      <div class="bar">
        <span id="label">—</span>
        <span id="ratio"></span>
        <span style="margin-left: auto" id="note"></span>
      </div>
      <iframe id="frame" title="Site preview"></iframe>
    </main>

    <script>
      const PALETTES = [
        { n: 'Original orange',  bg: '#fdfbfa', accent: '#ff4438', tint: '#ffe4e1' },
        { n: 'Sage on khaki',    bg: '#eeead7', accent: '#757d6f', tint: '#cfcebb' },
        { n: 'Burgundy on sand', bg: '#f3e6d5', accent: '#800020', tint: '#e4c8bd' },
        { n: 'Coral on sand',    bg: '#f3e6d5', accent: '#d45060', tint: '#ebbfb7' },
        { n: 'Sage on grey',     bg: '#f3f4f4', accent: '#757d6f', tint: '#d2d5d1', note: 'yours' },
        { n: 'Cyan on butter',   bg: '#fff1d1', accent: '#00b7cd', tint: '#abded0', tag: 'live' },
        { n: 'Spruce on linen',  bg: '#ece7e2', accent: '#4a7766', tint: '#c5ccc4' },
        { n: 'Burgundy on ivory',bg: '#fffcef', accent: '#7b001f', tint: '#eedbd4' },
        { n: 'Lemon navy on cream', bg: '#294075', accent: '#fdeea8', tint: '#fdeea8', text: '#fdeea8', textDim: '#b6ab79', cube: '#fdeea8', tag: 'cur', note: 'P 105-8 C bg / 938 C two-tone text' },
      ];

      // WCAG relative luminance + contrast, computed live rather than hardcoded.
      const lum = (hex) => {
        const c = [1, 3, 5].map((i) => parseInt(hex.substr(i, 2), 16) / 255)
          .map((v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
        return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      };
      const ratio = (a, b) => {
        const x = lum(a), y = lum(b);
        return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
      };

      const frame = document.getElementById('frame');
      const list = document.getElementById('list');
      let SRC = null;
      let active = PALETTES.length - 1;

      PALETTES.forEach((p, i) => {
        p.ratio = ratio(p.accent, p.bg);
        const b = document.createElement('button');
        b.className = 'p';
        b.type = 'button';
        b.innerHTML =
          '<span class="row"><span class="num">' + (i + 1) + '</span>' +
          '<span class="name"></span>' +
          (p.tag ? '<span class="tag ' + p.tag + '">' +
            (p.tag === 'live' ? 'committed' : 'current') + '</span>' : '') +
          '</span>' +
          '<span class="chips">' +
            '<span class="chip" style="background:' + p.bg + '"></span>' +
            '<span class="chip" style="background:' + p.accent + '"></span>' +
            '<span class="chip" style="background:' + p.tint + '"></span>' +
            (p.cube ? '<span class="chip" style="background:' + p.cube + '"></span>' : '') +
          '</span>' +
          '<span class="meta">' + p.accent + ' · <span class="' +
            (p.ratio < 3 ? 'warn' : p.ratio >= 4 ? 'good' : '') + '">' +
            p.ratio.toFixed(2) + ':1</span>' +
            (p.note ? ' · ' + p.note : '') + '</span>';
        b.querySelector('.name').textContent = p.n;
        b.addEventListener('click', () => show(i));
        list.appendChild(b);
        p.el = b;
      });

      function show(i) {
        active = i;
        const p = PALETTES[i];
        history.replaceState(null, '', '#' + (i + 1));

        PALETTES.forEach((q, j) =>
          q.el.setAttribute('aria-current', j === i ? 'true' : 'false'));

        document.getElementById('label').textContent = (i + 1) + '. ' + p.n;
        const r = document.getElementById('ratio');
        r.textContent = 'accent ' + p.ratio.toFixed(2) + ':1';
        r.className = p.ratio < 3 ? 'warn' : p.ratio >= 4 ? 'good' : '';
        document.getElementById('note').textContent =
          p.ratio < 3 ? 'below the 3:1 floor for graphics' : '';

        document.getElementById('css').textContent =
          '--bg: ' + p.bg + ';\n--accent: ' + p.accent + ';\n--tint: ' + p.tint + ';' +
          (p.cube ? '\n--cube: ' + p.cube + ';' : '') +
          (p.text ? '\n--ink/--body/--body-alt: ' + p.text + ';' : '') +
          (p.textDim ? '\n--muted/--faint: ' + p.textDim + ';' : '');

        if (SRC) frame.srcdoc = swap(SRC, p);
      }

      // Rewrite the tokens, and pin a <base> so ./support.js and
      // ./images/* still resolve from inside the srcdoc document.
      // Palettes without `cube` fall back to their accent; palettes
      // with `text` force every text neutral to that colour (dark-bg mode).
      function swap(src, p) {
        let out = src
          .replace(/--bg:\s*#[0-9a-fA-F]{3,8};/, '--bg: ' + p.bg + ';')
          .replace(/--accent:\s*#[0-9a-fA-F]{3,8};/, '--accent: ' + p.accent + ';')
          .replace(/--tint:\s*#[0-9a-fA-F]{3,8};/, '--tint: ' + p.tint + ';');
        if (/--cube:\s*#[0-9a-fA-F]{3,8};/.test(out))
          out = out.replace(/--cube:\s*#[0-9a-fA-F]{3,8};/, '--cube: ' + (p.cube || p.accent) + ';');
        else
          out = out.replace(/(--tint:\s*#[0-9a-fA-F]{3,8};)/, '$1\n        --cube: ' + (p.cube || p.accent) + ';');
        if (p.text) {
          const dim = p.textDim || p.text;
          out = out
            .replace(/--ink:\s*#[0-9a-fA-F]{3,8};/, '--ink: ' + p.text + ';')
            .replace(/--body:\s*#[0-9a-fA-F]{3,8};/, '--body: ' + p.text + ';')
            .replace(/--body-alt:\s*#[0-9a-fA-F]{3,8};/, '--body-alt: ' + p.text + ';')
            .replace(/--muted:\s*#[0-9a-fA-F]{3,8};/, '--muted: ' + dim + ';')
            .replace(/--faint:\s*#[0-9a-fA-F]{3,8};/, '--faint: ' + dim + ';');
        }
        return out.replace(/<head>/i, '<head><base href="' + location.href + '">');
      }

      document.getElementById('copy').addEventListener('click', async (e) => {
        try {
          await navigator.clipboard.writeText(document.getElementById('css').textContent);
          e.target.textContent = 'Copied';
        } catch (_) {
          e.target.textContent = 'Select the text above to copy';
        }
        setTimeout(() => { e.target.textContent = 'Copy three lines'; }, 1400);
      });

      addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key >= '1' && e.key <= String(PALETTES.length)) show(+e.key - 1);
        else if (e.key === 'ArrowDown') { e.preventDefault(); show((active + 1) % PALETTES.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); show((active + PALETTES.length - 1) % PALETTES.length); }
      });

      fetch('index.html')
        .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then((t) => {
          if (!/--accent:\s*#/.test(t))
            throw new Error('No --accent token found in index.html.');
          SRC = t;
          const fromHash = parseInt(location.hash.slice(1), 10);
          if (fromHash >= 1 && fromHash <= PALETTES.length) active = fromHash - 1;
          show(active);
        })
        .catch((err) => {
          document.querySelector('main').innerHTML =
            '<div class="err"><b>Could not load index.html.</b><br>' + err.message +
            '<br><br>Serve the folder over HTTP rather than opening this file directly:' +
            '<br><code>python3 -m http.server 8000</code>, then open ' +
            '<code>http://127.0.0.1:8000/palette-preview.html</code>.</div>';
        });
    </script>
  </body>
</html>
